name: GPSLess
options:
  bundleIdPrefix: software.leea
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.29.0
targets:
  GPSLess:
    type: application
    platform: iOS
    sources:
      - path: GPSLess
        excludes:
          - OfflineData
          - Info.plist
      - path: Core
      - path: GPSLess/OfflineData
        type: folder
        buildPhase: resources
    info:
      path: GPSLess/Info.plist
      properties:
        CFBundleDisplayName: GPSLess
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMotionUsageDescription: Phone motion measures vehicle movement without using GPS. Tracking stays on this iPhone.
        NSLocationWhenInUseUsageDescription: Location keeps a drive running while you use another app or the screen is off, and optional GPS tracing records reference data for test analysis. Positioning never uses GPS.
        UIBackgroundModes: [location]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    dependencies:
      - package: MapLibre
    postBuildScripts:
      - name: Record build identity
        script: /bin/bash "$SRCROOT/tools/write_build_identity.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GPSLESS_BUNDLE_IDENTIFIER)
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.3.2"
        CURRENT_PROJECT_VERSION: 22
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  GPSLessServiceTests:
    type: bundle.unit-test
    platform: iOS
    sources: AppTests
    dependencies:
      - target: GPSLess
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/GPSLess.app/GPSLess
        BUNDLE_LOADER: $(TEST_HOST)
  GPSLessUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: UITests
    dependencies:
      - target: GPSLess
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GPSLess:
    build:
      targets:
        GPSLess: all
    test:
      targets:
        - GPSLessServiceTests
        - GPSLessUITests
